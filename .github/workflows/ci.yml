name: CI

# A branch is checked by its pull request, so a push to it runs once rather
# than twice; main and the tags on their own.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pipx install gcovr

      - name: Build, run and measure the tests
        working-directory: test
        run: cmake --workflow --preset coverage

      - name: Coverage in the summary
        if: always()
        run: |
          if [ -f build_tests/coverage/coverage/coverage.md ]; then
            cat build_tests/coverage/coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build_tests/coverage/coverage/

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build_tests/coverage/junit.xml

  firmware:
    name: Firmware (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: espressif/idf:v5.5.5
    env:
      IDF_CCACHE_ENABLE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            dir: build
            flags: ""
          # The development build: the remote log, screen, bench and crash pages.
          - variant: remote
            dir: build_remote
            flags: -DCMAKE_CXX_FLAGS=-DREMOTE_ENABLED=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from git describe

      - name: Secrets from their templates
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for template in $(git ls-files '*_secrets.example.h'); do
            cp "$template" "${template%.example.h}.h"
          done

      # The component manager records the local esp_hosted copy by the absolute
      # path of whoever last built; here it is this checkout's.
      - name: The local component where it is here
        shell: bash
        run: |
          sed -i "s|path: .*/components/esp_hosted$|path: $PWD/components/esp_hosted|" dependencies.lock

      # What the last build compiled, so only what changed is compiled again.
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.variant }}-

      - name: Downloaded components
        uses: actions/cache@v4
        with:
          path: managed_components
          key: components-${{ hashFiles('dependencies.lock') }}

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B ${{ matrix.dir }} ${{ matrix.flags }} build
          ccache -s

      # One image for the whole flash, written at 0x0 on a panel fresh from
      # the box or one that will not boot.
      - name: Merge the images
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B ${{ matrix.dir }} merge-bin -o smart_flexispot-full.bin

      - name: Size in the summary
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          {
            echo "### Firmware size, ${{ matrix.variant }}"
            echo '```'
            idf.py -B ${{ matrix.dir }} size
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: |
            ${{ matrix.dir }}/smart_flexispot-full.bin
            ${{ matrix.dir }}/smart_flexispot.bin
            ${{ matrix.dir }}/smart_flexispot.elf
            ${{ matrix.dir }}/bootloader/bootloader.bin
            ${{ matrix.dir }}/partition_table/partition-table.bin
            ${{ matrix.dir }}/ota_data_initial.bin
            ${{ matrix.dir }}/flash_args

  simulator:
    name: Simulator and screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL, curl, zlib, ccache and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libcurl4-openssl-dev zlib1g-dev pkg-config xvfb ccache

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-sim-${{ github.sha }}
          restore-keys: ccache-sim-

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          cmake -S sim -B sim/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build sim/build -j "$(nproc)"
          ccache -s

      # SDL's dummy driver has no renderer on Linux; a virtual X server has.
      - name: Screenshots of the main views
        run: xvfb-run -a -s "-screen 0 1280x720x24" cmake --build sim/build --target screenshots

      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: sim/build/screenshots/

  # A tag as v1.2.0 puts the release build's images on a GitHub release.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware-release
          path: firmware

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="$GITHUB_REF_NAME" '$0 ~ "^## " tag "," {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          title="$GITHUB_REF_NAME: $(grep -m1 . notes.md | sed 's/\.$//')"
          cd firmware
          cp smart_flexispot-full.bin "smart_flexispot-${GITHUB_REF_NAME}-full.bin"
          cp smart_flexispot.bin "smart_flexispot-${GITHUB_REF_NAME}-ota.bin"
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$title" --notes-file ../notes.md \
            "smart_flexispot-${GITHUB_REF_NAME}-full.bin" "smart_flexispot-${GITHUB_REF_NAME}-ota.bin" \
            ../LICENSE ../THIRD_PARTY_NOTICES.md
